<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Změna barvy</title>
</head>
<body>

<button onclick="zmenBarvu('blue')">Modrá</button>
<button onclick="zmenBarvu('red')">Červená</button>


<script>
function zmenBarvu(x) {
    document.body.style.backgroundColor = x;
}
</script>

</body>
</html>
